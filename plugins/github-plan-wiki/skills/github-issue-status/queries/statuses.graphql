# Planning statuses available in a repository, in display order.
# planningStatuses is null when issue statuses are not available for this repository or viewer.
query ($owner: String!, $repo: String!) {
  repository(owner: $owner, name: $repo) {
    planningStatuses(first: 50) {
      nodes {
        id
        name
        category { key name state stateReason }
      }
    }
  }
}
