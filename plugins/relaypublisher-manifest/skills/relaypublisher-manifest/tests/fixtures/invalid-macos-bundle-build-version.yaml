SchemaVersion: "1.0"
PackageIdentifier: Contoso.StaleBundleBuildVersion
PackageName: Contoso Stale Bundle Build Version
Publisher: Contoso Ltd.
Description: >-
  IncludedApps[].BundleBuildVersion does not exist in the v1.1.0
  IncludedAppManifest model and must be rejected as an unsupported field.
PackageVersion: "1.0.0"
Icon: icons/contoso.png

Apps:
  - Platform: macos
    Architecture: arm64
    InstallerType: pkg
    AppType: lob
    DisplayName: Contoso Stale Bundle Build Version [macOS Arm64]
    Source:
      Type: azureBlob
      AccountName: examplepackages
      Container: intune-packages
      BlobName: macos/contoso-stale-build/1.0.0/ContosoLob.pkg
      Destination: ContosoLob.pkg
      Sha256: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      Auth:
        Type: workloadIdentity
    Requirements:
      MinimumOSVersion: "13.0"
    Detection:
      IncludedApps:
        - BundleId: com.example.contoso.lob.main
          BundleVersion: "1.0.0"
          BundleBuildVersion: "1000"
