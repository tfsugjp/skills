SchemaVersion: "1.0"
PackageIdentifier: Contoso.PrefixMatch
PackageName: Contoso Prefix Match
Publisher: Contoso Ltd.
Description: Primary selector resolves by dot-segment prefix, not exact match.
PackageVersion: "1.0.0"

Apps:
  - Platform: macos
    Architecture: arm64
    InstallerType: pkg
    AppType: pkg
    DisplayName: Contoso Prefix Match [macOS Arm64]
    Source:
      Type: azureBlob
      AccountName: examplepackages
      Container: intune-packages
      BlobName: macos/contoso-prefix/1.0.0/Contoso.pkg
      Destination: Contoso.pkg
      Sha256: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      Auth:
        Type: workloadIdentity
    Requirements:
      MinimumOSVersion: "13.0"
    Detection:
      PrimaryBundleId: com.example.client
      IncludedApps:
        - BundleId: com.example.client.main
          BundleVersion: "1.0.0"
        - BundleId: com.example.helper
          BundleVersion: "1.0.0"
