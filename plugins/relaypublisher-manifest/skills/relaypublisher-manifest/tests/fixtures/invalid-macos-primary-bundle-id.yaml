SchemaVersion: "1.0"
PackageIdentifier: Contoso.StalePrimaryBundleId
PackageName: Contoso Stale Primary Bundle Id
Publisher: Contoso Ltd.
Description: >-
  Detection.PrimaryBundleId does not exist in the v1.1.0 manifest schema;
  ManifestLoader silently ignores it and the primary entry is always
  IncludedApps[0].
PackageVersion: "1.0.0"

Apps:
  - Platform: macos
    Architecture: arm64
    InstallerType: pkg
    AppType: pkg
    DisplayName: Contoso Stale Primary Bundle Id [macOS Arm64]
    Source:
      Type: azureBlob
      AccountName: examplepackages
      Container: intune-packages
      BlobName: macos/contoso-stale-primary/1.0.0/Contoso.pkg
      Destination: Contoso.pkg
      Sha256: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      Auth:
        Type: workloadIdentity
    Requirements:
      MinimumOSVersion: "13.0"
    Detection:
      PrimaryBundleId: com.example.contoso.client
      IncludedApps:
        - BundleId: com.example.contoso.client
          BundleVersion: "1.0.0"
        - BundleId: com.example.contoso.helper
          BundleVersion: "1.0.0"
