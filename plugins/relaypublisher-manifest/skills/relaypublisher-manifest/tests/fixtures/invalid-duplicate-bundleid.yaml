SchemaVersion: "1.0"
PackageIdentifier: Contoso.DuplicateBundle
PackageName: Contoso Duplicate Bundle
Publisher: Contoso Ltd.
Description: Duplicate BundleId values must be rejected.
PackageVersion: "1.0.0"

Apps:
  - Platform: macos
    Architecture: arm64
    InstallerType: pkg
    AppType: pkg
    DisplayName: Contoso Duplicate Bundle [macOS Arm64]
    Source:
      Type: azureBlob
      AccountName: examplepackages
      Container: intune-packages
      BlobName: macos/contoso-duplicate/1.0.0/Contoso.pkg
      Destination: Contoso.pkg
      Sha256: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      Auth:
        Type: workloadIdentity
    Requirements:
      MinimumOSVersion: "13.0"
    Detection:
      IncludedApps:
        - BundleId: com.example.contoso.client
          BundleVersion: "1.0.0"
        - BundleId: com.example.contoso.client
          BundleVersion: "1.0.1"
