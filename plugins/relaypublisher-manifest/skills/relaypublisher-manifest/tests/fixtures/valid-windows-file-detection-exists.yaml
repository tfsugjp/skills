SchemaVersion: "1.0"
PackageIdentifier: Contoso.Tool.FileDetectionExists
PackageName: Contoso Tool File Detection Exists
Publisher: Contoso Ltd.
Description: >-
  Windows file-system detection using OperationType exists and an
  environment-variable-rooted Path.
PackageVersion: "1.2.3"

Apps:
  - Platform: windows
    Architecture: x64
    InstallerType: win32
    DisplayName: Contoso Tool File Detection Exists [Windows x64]

    Package:
      IntuneWin:
        SetupFile: install.ps1
      RepositoryFiles:
        - Source: scripts/windows/x64/install.ps1
          Destination: install.ps1
        - Source: scripts/windows/common/uninstall.ps1
          Destination: uninstall.ps1

    Install:
      CommandLine: powershell.exe -ExecutionPolicy Bypass -File .\install.ps1
      UninstallCommandLine: powershell.exe -ExecutionPolicy Bypass -File .\uninstall.ps1
      InstallExperience: system
      RestartBehavior: suppress

    Detection:
      Type: file
      Path: '%ProgramFiles%\Contoso Tool'
      FileOrFolderName: contoso-tool.exe
      OperationType: exists

    Requirements:
      MinimumOSVersion: "10.0.19045"
      Architecture: x64
