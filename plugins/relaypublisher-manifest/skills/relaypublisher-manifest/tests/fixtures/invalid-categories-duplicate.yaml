SchemaVersion: "1.0"
PackageIdentifier: Contoso.DuplicateCategory
PackageName: Contoso Duplicate Category
Publisher: Contoso Ltd.
Description: >-
  Category names are compared case-insensitively; "Business Apps" and
  "business apps" are the same name.
PackageVersion: "1.0.0"

Apps:
  - Platform: macos
    Architecture: arm64
    InstallerType: pkg
    AppType: pkg
    Source:
      Type: azureBlob
      AccountName: examplepackages
      Container: intune-packages
      BlobName: macos/contoso-cat/1.0.0/Contoso.pkg
      Destination: Contoso.pkg
      Sha256: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      Auth:
        Type: workloadIdentity
    Requirements:
      MinimumOSVersion: "13.0"
    Detection:
      IncludedApps:
        - BundleId: com.example.contoso.client
          BundleVersion: "1.0.0"
    Categories:
      - Business Apps
      - business apps
