SchemaVersion: "1.0"
PackageIdentifier: Contoso.Full
PackageName: Contoso Full
Publisher: Contoso Ltd.
Description: Exercises Assignments, Categories, and macOS Scripts together.
PackageVersion: "1.0.0"

Apps:
  - Platform: macos
    Architecture: arm64
    InstallerType: pkg
    AppType: pkg
    Source:
      Type: azureBlob
      AccountName: examplepackages
      Container: intune-packages
      BlobName: macos/contoso-full/1.0.0/Contoso.pkg
      Destination: Contoso.pkg
      Sha256: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      Auth:
        Type: workloadIdentity
    Requirements:
      MinimumOSVersion: "13.0"
    Detection:
      IncludedApps:
        - BundleId: com.example.contoso.client
          BundleVersion: "1.0.0"
    Scripts:
      PreInstall: scripts/valid-preinstall.sh
    Categories:
      - Business Apps
      - Productivity
    Assignments:
      - Target: group
        GroupId: "00000000-0000-0000-0000-000000000001"
        Intent: required
      - Target: allDevices
        Mode: exclude
