SchemaVersion: "1.0"
PackageIdentifier: Contoso.Tool.FileDetectionBadPath
PackageName: Contoso Tool File Detection Bad Path
Publisher: Contoso Ltd.
Description: >-
  Detection.Path must be a target-device drive-rooted, root-relative, UNC,
  or environment-variable-rooted path, not a repository-relative one.
PackageVersion: "1.2.3"

Apps:
  - Platform: windows
    Architecture: x64
    InstallerType: win32
    DisplayName: Contoso Tool File Detection Bad Path [Windows x64]

    Package:
      IntuneWin:
        SetupFile: install.ps1
      RepositoryFiles:
        - Source: scripts/windows/x64/install.ps1
          Destination: install.ps1
        - Source: scripts/windows/common/uninstall.ps1
          Destination: uninstall.ps1

    Install:
      CommandLine: powershell.exe -ExecutionPolicy Bypass -File .\install.ps1
      UninstallCommandLine: powershell.exe -ExecutionPolicy Bypass -File .\uninstall.ps1
      InstallExperience: system
      RestartBehavior: suppress

    Detection:
      Type: file
      Path: 'scripts\windows\x64'
      FileOrFolderName: contoso-tool.exe
      OperationType: exists

    Requirements:
      MinimumOSVersion: "10.0.19045"
      Architecture: x64
