# Optional: run Stryker.NET mutation testing once per pull request.
# Copy to .github/workflows/mutation-testing.yml in the consumer repository.
# Prerequisites in the consumer repository:
#   - Copy the skill's scripts/mutation-run.cs helper to eng/mutation-run.cs. The workflow runs the helper
#     instead of Stryker directly, so the full-run fallback stop, the timeout, and test-runner
#     (Microsoft.Testing.Platform) detection apply in CI as they do locally.
#   - The helper is a file-based app, so CI needs the .NET SDK 10 or later (pinned through global.json).
#   - dotnet-stryker is installed as a local tool (dotnet-tools.json).
# It runs once when a non-draft pull request is opened (or reopened), once when a draft is
# marked ready for review, or when started manually. It does not run on later pushes to the PR
# ("synchronize") or on every build; rerun it manually after substantial changes.
name: Mutation testing

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      base:
        description: Base branch to compare against
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: mutation-testing-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  mutation:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # The base branch reaches scripts only through this variable; never interpolate it into script text.
      BASE_BRANCH: ${{ github.event.pull_request.base.ref || inputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Diff mode needs the base branch history.
          fetch-depth: 0

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          # Replace with "dotnet-version: <version>" (10.0 or later) when the repository has no global.json.
          global-json-file: global.json

      - name: Validate and fetch base branch
        run: |
          # Reject names git would not accept as a branch, and names it would rewrite (for example @{-1}).
          if ! normalized="$(git check-ref-format --branch "$BASE_BRANCH")" || [ "$normalized" != "$BASE_BRANCH" ]; then
            echo "::error::Invalid base branch name."
            exit 1
          fi
          # checkout persists its credentials by default, so this fetch also works for private repositories.
          git fetch --no-tags origin "+refs/heads/${BASE_BRANCH}:refs/remotes/origin/${BASE_BRANCH}"

      - name: Restore local tools
        run: dotnet tool restore

      - name: Run mutation testing on changed code
        # Keep --timeout-minutes below the job timeout so the helper stops Stryker and reports first.
        run: dotnet run eng/mutation-run.cs -- run --base "$BASE_BRANCH" --timeout-minutes 45

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: StrykerOutput/pre-pr/reports/
          if-no-files-found: ignore
