name: Validate marketplaces

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"

      - name: Validate marketplace metadata and plugin boundaries
        run: python scripts/validate_marketplaces.py

      - name: Validate GitHub Wiki template links
        run: >-
          python -m unittest discover
          -s plugins/github-plan-wiki/skills/github-wiki-plan/tests
          -p 'test_*.py'
