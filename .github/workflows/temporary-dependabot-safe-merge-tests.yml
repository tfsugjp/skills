name: Temporary Dependabot Safe Merge Tests

on:
  push:
    branches:
      - feature/20-dependabot-safe-merge
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.x"
      - name: Run policy unit tests
        run: python -m unittest discover -s plugins/dependabot-safe-merge/skills/dependabot-safe-merge/tests -p "test_*.py"
